<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
  <!-- Offline sandbox: scripts only from the app's own files, nothing is
       ever fetched from the network (no tracking pixels, no remote images
       or fonts embedded in a document), images only from the document. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' file: 'unsafe-eval'; style-src 'self' file: 'unsafe-inline'; img-src data: blob:; font-src data: blob:; media-src data: blob:; connect-src blob:; frame-src 'none'; form-action 'none'">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="tabs" hidden></div>
  <div id="content"></div>
  <script src="viewer.js"></script>
</body>
</html>
